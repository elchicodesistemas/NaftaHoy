version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: naftahoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naftahoy
      POSTGRES_USER: naftahoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en infrastructure/docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naftahoy -d naftahoy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: naftahoy-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://naftahoy:${POSTGRES_PASSWORD}@postgres:5432/naftahoy?schema=public
      - CORS_ORIGIN=http://naftahoy.com,https://naftahoy.com,http://localhost:3000
      - SYNC_API_TOKEN=${SYNC_API_TOKEN:?Definí SYNC_API_TOKEN en infrastructure/docker/.env}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?Definí ADMIN_API_TOKEN en infrastructure/docker/.env}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://naftahoy.com/api
    container_name: naftahoy-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://naftahoy.com/api
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
