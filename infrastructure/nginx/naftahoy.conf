# Requiere certificados emitidos para naftahoy.com y www.naftahoy.com.
server {
    listen 80;
    server_name naftahoy.com www.naftahoy.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://naftahoy.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.naftahoy.com;
    ssl_certificate /etc/letsencrypt/live/naftahoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naftahoy.com/privkey.pem;
    return 301 https://naftahoy.com$request_uri;
}

server {
    listen 443 ssl;
    server_name naftahoy.com;

    ssl_certificate /etc/letsencrypt/live/naftahoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naftahoy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Entorno de revisión aislado: no comparte procesos ni base con producción.
    location = /staging { return 301 /staging/; }

    location /staging/api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staging/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
