services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: naftahoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naftahoy
      POSTGRES_USER: naftahoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en infrastructure/docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naftahoy -d naftahoy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: naftahoy-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://naftahoy:${POSTGRES_PASSWORD}@postgres:5432/naftahoy?schema=public
      - CORS_ORIGIN=http://naftahoy.com,https://naftahoy.com,http://localhost:3000
      - SYNC_API_TOKEN=${SYNC_API_TOKEN:?Definí SYNC_API_TOKEN en infrastructure/docker/.env}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?Definí ADMIN_API_TOKEN en infrastructure/docker/.env}
      - VOTE_TOKEN_SECRET=${VOTE_TOKEN_SECRET:?Definí VOTE_TOKEN_SECRET en infrastructure/docker/.env}
      - VOTE_COOKIE_NAME=naftahoy_vote
      - VOTE_COOKIE_PATH=/
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ADVERTISING_RECIPIENT=${ADVERTISING_RECIPIENT:-publicidad@naftahoy.com}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://naftahoy.com/api
        NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${CARTO_BASEMAP_KEY:?Definí CARTO_BASEMAP_KEY en infrastructure/docker/.env}
    container_name: naftahoy-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://naftahoy.com/api
      - NAFTAHOY_INTERNAL_API_URL=http://backend:3001/api
      - NEXT_PUBLIC_CARTO_BASEMAP_KEY=${CARTO_BASEMAP_KEY:?Definí CARTO_BASEMAP_KEY en infrastructure/docker/.env}
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
