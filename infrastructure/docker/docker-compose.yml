version: '3.8'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: naftahoy-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - CORS_ORIGIN=http://naftahoy.com,https://naftahoy.com,http://localhost:3000
    volumes:
      - backend-data:/app/data
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: naftahoy-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://naftahoy.com/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
